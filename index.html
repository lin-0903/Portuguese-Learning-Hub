      "rules": [

          "重音符号 ´：通常标出重读元音；开闭口还会因字母而不同。"
        ],
        [
          "ê / ô",
          "尖帽 ^：标重读，也提示相应元音发音。"
        ],
        [
          "ã / õ",
          "波浪 ~：鼻化音，不是简单的英文 n。"
        ],
        [
          "ç",
          "ç 通常读 /s/；如 coração。"
        ],
        [
          "ti / di",
          "巴西很多地区的 ti / di 常发得接近“chi / ji”，但地区口音有差异。"
        ]
      ],
      "examples": [
        {
          "pt": "você",
          "zh": "你（重音落在 cê）"
        },
        {
          "pt": "amanhã",
          "zh": "明天；ã 有鼻化音"
        },
        {
          "pt": "até já",
          "zh": "待会见；até 有重音"
        }
      ],

<script>

const DATA=JSON.parse(document.getElementById('study-data').textContent);

let store={...initial,...saved};if(!Array.isArray(store.done))store.done=[];if(!Array.isArray(store.wrong))store.wrong=[];if(!store.cardData||typeof store.cardData!=='object')store.cardData={};

function shuf(arr){let copy=arr.slice();for(let i=copy.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]];}return copy}

function due(i){let c=store.cardData[i];return !c||!c.next||c.next<=day()}
function dueNum(){return vocab.reduce((a,x,i)=>a+(due(i)?1:0),0)}

function renderLesson(){let l=lessonBy(lessonId),arr=questions.filter(q=>q.lesson===l.id),qq=arr[lessonQuickIndex%arr.length],done=store.done.includes(l.id);app.innerHTML=`<div class="actions" style="margin-bottom:19px"><button class="btn secondary" id="backlessons">← 返回学习地图</button><span class="pill">${escapeHtml(l.group)}</span><span class="pill">${escapeHtml(l.tag)}</span></div><div class="lesson-heading"><div class="big-emoji">${l.emoji}</div><div><span class="eyebrow">ONE SMALL RULE AT A TIME</span><h1>${escapeHtml(l.title)}</h1><p>先懂意思，再背口诀，最后自己动手选答案。</p></div></div>
<div class="lesson-body"><div><div class="panel"><h2>① 一句话理解</h2><div class="bigidea">${escapeHtml(l.idea)}</div><h2>② 重点规则</h2>${l.rules.map(r=>`<div class="rule"><div class="pt">${escapeHtml(r[0])}</div><div class="zh">${escapeHtml(r[1])}</div></div>`).join('')}</div><div class="panel" style="margin-top:17px"><h2>③ 直接学会说的例句 <span class="small muted">点 🔊 可朗读</span></h2>${l.examples.map(e=>`<div class="example-row"><div class="textline"><div class="pt">${escapeHtml(e.pt)}</div><div class="zh">${escapeHtml(e.zh)}</div></div><button class="iconbtn" data-speech="${escapeHtml(e.pt)}" aria-label="朗读葡语">🔊</button></div>`).join('')}</div><div class="quickq"><h2 style="margin:0">④ 小试一下 · 第 ${lessonQuickIndex%arr.length+1}/${arr.length} 题</h2><p class="muted small">不需要背得很完美，试着选就行。</p><div style="font-size:17px;font-weight:750;margin-top:13px">${escapeHtml(qq.prompt)}</div><div class="options" id="quickoptions">${shuf(qq.options).map(opt=>`<button class="option" data-qopt="${escapeHtml(opt)}">${escapeHtml(opt)}</button>`).join('')}</div><div id="quickfeedback"></div><div class="actions"><button class="btn secondary" id="quicknext">换一道题 →</button><button class="btn ${done?'green':'primary'}" id="finish">${done?'✓ 已学过 · 再巩固':'✓ 学完这一课'}</button></div></div></div><aside class="sticky-notes"><div class="note"><h3>🧠 超短记忆口诀</h3><p>${escapeHtml(l.chant)}</p></div><div class="note pink"><h3>⚠️ 不要掉进这个坑</h3><p>${escapeHtml(l.trap)}</p></div><div class="note" style="background:#f7f2e8"><h3>🌱 复习建议</h3><p>先把例句读三遍，再换主语/名词试着说。看完就点上面的测验，答错马上有解析。</p></div></aside></div>`;
$('backlessons').onclick=()=>navigate('lessons');$('finish').onclick=finishLesson;$('quicknext').onclick=()=>{lessonQuickIndex++;renderLesson()};document.querySelectorAll('[data-speech]').forEach(b=>b.onclick=()=>speak(b.dataset.speech));document.querySelectorAll('[data-qopt]').forEach(b=>b.onclick=()=>{if(quickSelected!==null)return;quickSelected=b.dataset.qopt;let good=quickSelected===qq.answer;record(qq,good);document.querySelectorAll('[data-qopt]').forEach(x=>{x.disabled=true;if(x.dataset.qopt===qq.answer)x.classList.add('correct');else if(x.dataset.qopt===quickSelected)x.classList.add('wrong')});$('quickfeedback').innerHTML=`<div class="feedback ${good?'good':'bad'}">${good?'🎉 答对了！':'💡 差一点点！正确答案：'+escapeHtml(qq.answer)}<br>${escapeHtml(qq.why)}</div>`});quickSelected=null;}
function record(q,good){store.total++;if(good){store.correct++;store.wrong=store.wrong.filter(x=>x!==q.id)}else if(!store.wrong.includes(q.id))store.wrong.push(q.id);save();renderNav()}
function rebuildCards(){cardPool=vocab.map((x,i)=>i).filter(i=>(cardCategory==='全部'||vocab[i].category===cardCategory)&&(cardShow==='all'||due(i))&&(!cardSearch||[vocab[i].word,vocab[i].zh].join(' ').toLowerCase().includes(cardSearch.toLowerCase())));cardIndex=0;cardFlip=false;}
function cardControls(){let cats=['全部',...new Set(vocab.map(x=>x.category))];return `<div class="toolbar"><select id="cardcat" class="field" aria-label="词汇分类">${cats.map(x=>`<option value="${escapeHtml(x)}" ${cardCategory===x?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select><select id="cardshow" class="field" aria-label="学习卡片类型"><option value="due" ${cardShow==='due'?'selected':''}>🔁 到期/还没学 (${dueNum()})</option><option value="all" ${cardShow==='all'?'selected':''}>📋 全部卡片 (${vocab.length})</option></select><input class="field search" id="cardsearch" placeholder="🔎 搜单词或中文" value="${escapeHtml(cardSearch)}"><button class="btn secondary" id="cardsreset">清除筛选</button></div>`}
function renderCards(){rebuildCards();app.innerHTML=`<div class="section-head" style="margin-top:0"><div><h2>翻翻单词卡 🃏</h2><p>先看葡语，猜中文，再翻开。点「记住了」会自动安排下次复习。</p></div><span class="pill">${vocab.length} 张单词卡</span></div>${cardControls()}<div id="cardzone"></div><div class="banner" style="margin-top:20px"><div class="emoji">🧠</div><div><strong>自动复习间隔：</strong>第一次记住后隔 1 天复习，再是 3、7、14 天…… 如果忘了，就重新安排近一点复习。这些卡片的掌握程度保存在你的浏览器中。</div></div>`;
$('cardcat').onchange=e=>{cardCategory=e.target.value;renderCards()};$('cardshow').onchange=e=>{cardShow=e.target.value;renderCards()};$('cardsearch').oninput=e=>{cardSearch=e.target.value;rebuildCards();drawCard()};$('cardsreset').onclick=()=>{cardCategory='全部';cardShow='due';cardSearch='';renderCards()};drawCard();}
function drawCard(){let zone=$('cardzone');if(!zone)return;if(!cardPool.length){zone.innerHTML=`<div class="empty"><span class="e">🎉</span><strong>这组卡片复习完了！</strong><p>可以换分类，或选择「全部卡片」继续练习。</p></div>`;return;}cardIndex=Math.min(cardIndex,cardPool.length-1);let ix=cardPool[cardIndex],v=vocab[ix],info=store.cardData[ix]||{level:0};zone.innerHTML=`<div class="flash-layout"><div class="flashcard ${cardFlip?'revealed':''}" role="button" tabindex="0" id="flashcard"><div class="counter">${cardIndex+1} / ${cardPool.length} · ${escapeHtml(v.category)} · 熟悉度 ${info.level||0}/5</div><div class="pos">${escapeHtml(v.pos)}</div><div class="card-pt">${escapeHtml(v.word)}</div>${cardFlip?`<div class="card-zh">${escapeHtml(v.zh)}</div><div class="card-ex">${escapeHtml(v.example)}</div>`:`<div class="hint">👆 点卡片，翻到中文答案</div>`}</div><div class="flash-actions"><button class="btn secondary" id="prevcard" ${cardIndex===0?'disabled':''}>← 上一张</button><button class="btn secondary" id="saycard">🔊 发音</button><button class="btn soft" id="flipcard">${cardFlip?'背面 ↩':'👀 看答案'}</button><button class="btn secondary" id="skipcard">跳过 →</button></div>${cardFlip?`<div class="flash-actions"><button class="btn warning" id="hardcard">😵 忘记了 · 尽快再练</button><button class="btn green" id="knowcard">😎 记住了 · 安排复习</button></div>`:''}<div class="small muted" style="text-align:center">键盘：<kbd>空格</kbd> 翻卡 · <kbd>→</kbd> 下一张</div></div>`;
const flip=()=>{cardFlip=!cardFlip;drawCard()};$('flashcard').onclick=flip;$('flashcard').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}};$('flipcard').onclick=flip;$('saycard').onclick=()=>speak(v.word.includes('/')?v.word.split('/')[0].trim():v.word);$('prevcard').onclick=()=>{if(cardIndex>0){cardIndex--;cardFlip=false;drawCard()}};$('skipcard').onclick=()=>{cardIndex=(cardIndex+1)%cardPool.length;cardFlip=false;drawCard()};if(cardFlip){$('hardcard').onclick=()=>gradeCard(ix,false);$('knowcard').onclick=()=>gradeCard(ix,true)}}
function gradeCard(ix,good){let old=store.cardData[ix]||{level:0};let level=good?Math.min(5,(old.level||0)+1):0;let days=good?[0,1,3,7,14,30][level]:0;store.cardData[ix]={level,next:addDays(days),last:day()};save();if(cardShow==='due'&&good){cardPool=cardPool.filter(x=>x!==ix);if(cardIndex>=cardPool.length)cardIndex=0}else{cardIndex=(cardIndex+1)%cardPool.length;}cardFlip=false;renderNav();drawCard();}
function startQuiz(mode){let pool=questions.filter(x=>x.lesson!=='family');if(mode==='wrong')pool=questions.filter(x=>store.wrong.includes(x.id));else if(quizTopic!=='all')pool=pool.filter(x=>x.lesson===quizTopic);if(mode==='wrong'&&!pool.length){navigate('mistakes');return}quiz={mode,pool:shuf(pool).slice(0,mode==='wrong'?Math.min(30,pool.length):Math.min(12,pool.length)),cursor:0,score:0,answered:false,choice:null};navigate('quiz')}
function renderQuiz(){if(!quiz){app.innerHTML=`<div class="section-head" style="margin-top:0"><div><h2>测验训练场 ✍️</h2><p>每轮最多 12 题；每道题都有中文解释，答错会自动收入错题本。</p></div></div><div class="panel quiz-wrap"><div class="bigidea" style="font-size:16px">🌟 不用担心做错。错题只是告诉我们：“这个知识点值得再看一次。”</div><h3>选择今天要练习什么</h3><div class="toolbar"><select id="quiztopic" class="field" style="min-width:270px"><option value="all">🎲 所有已学知识混合</option>${CORE.map(l=>`<option value="${l.id}" ${quizTopic===l.id?'selected':''}>${escapeHtml(l.title)}</option>`).join('')}</select></div><div class="actions"><button class="btn primary" id="startquiz">⚡ 开始 12 题</button><button class="btn secondary" id="startwrong" ${store.wrong.length?'':'disabled'}>🎯 只练错题 (${store.wrong.length})</button></div><div class="banner" style="margin-top:26px"><div class="emoji">🔍</div><div>老师可能在题目里只换了一个名词。记住：<strong>先抓句意 → 看主语 → 看名词性别/单复数 → 决定答案</strong>。照着这四步选就行。</div></div></div>`;$('quiztopic').onchange=e=>quizTopic=e.target.value;$('startquiz').onclick=()=>startQuiz('random');$('startwrong').onclick=()=>startQuiz('wrong');return}
let total=quiz.pool.length;if(quiz.cursor>=total){let p=Math.round(quiz.score/total*100);app.innerHTML=`<div class="panel quiz-wrap quiz-result"><div class="huge">${p===100?'🏆':p>=70?'🎉':'🌱'}</div><h2>完成这一轮！</h2><div style="font-size:52px;font-weight:900;color:var(--purple)">${quiz.score} / ${total}</div><p class="muted">${p===100?'全对！太棒啦，继续保持。':p>=70?'基本掌握了！再复习一下错的部分。':'今天已经把容易忘的点找出来了，下轮会更好。'}</p><div class="actions" style="justify-content:center"><button class="btn primary" id="again">再来一轮</button><button class="btn secondary" id="gwrong">复习错题 (${store.wrong.length})</button></div></div>`;$('again').onclick=()=>{quiz=null;renderQuiz()};$('gwrong').onclick=()=>{quiz=null;navigate('mistakes')};return}
let q=quiz.pool[quiz.cursor];if(!quiz.options||quiz.optionFor!==q.id){quiz.options=shuf(q.options);quiz.optionFor=q.id}app.innerHTML=`<div class="quiz-wrap"><div class="quiz-top"><span class="pill">第 ${quiz.cursor+1} / ${total} 题</span><span class="pill">🌟 本轮答对 ${quiz.score} 题</span></div><div class="quiz-progress"><div style="width:${quiz.cursor/total*100}%"></div></div><div class="quiz-card"><span class="taglabel">${escapeHtml(lessonBy(q.lesson).title)}</span><div class="quiz-question">${escapeHtml(q.prompt)}</div><div class="options">${quiz.options.map((opt,i)=>`<button class="option ${quiz.answered?(opt===q.answer?'correct':opt===quiz.choice?'wrong':''):''}" data-answer="${i}" ${quiz.answered?'disabled':''}>${String.fromCharCode(65+i)}. ${escapeHtml(opt)}</button>`).join('')}</div>${quiz.answered?`<div class="feedback ${quiz.choice===q.answer?'good':'bad'}">${quiz.choice===q.answer?'✅ 对啦！':'💡 正确答案：'+escapeHtml(q.answer)}<br>${escapeHtml(q.why)}</div><button class="btn primary" id="nextq" style="margin-top:19px;width:100%">${quiz.cursor+1===total?'看本轮成绩 →':'下一题 →'}</button>`:''}</div><div class="actions" style="margin-top:20px"><button class="btn secondary" id="quitquiz">退出本轮练习</button></div></div>`;
document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(quiz.answered)return;quiz.choice=quiz.options[Number(b.dataset.answer)];quiz.answered=true;if(quiz.choice===q.answer)quiz.score++;record(q,quiz.choice===q.answer);renderQuiz()});if(quiz.answered)$('nextq').onclick=()=>{quiz.cursor++;quiz.answered=false;quiz.choice=null;quiz.options=null;renderQuiz()};$('quitquiz').onclick=()=>{quiz=null;renderQuiz()};}
function renderMistakes(){let list=questions.filter(q=>store.wrong.includes(q.id));app.innerHTML=`<div class="section-head" style="margin-top:0"><div><h2>错题小黑屋 🎯</h2><p>不是惩罚区，是专门帮你把知识变牢固的复习区。</p></div></div>${list.length?`<div class="banner"><div class="emoji">🛠️</div><div>还有 ${list.length} 道需要复习。点击下面的练习后，只要答对，这道题就会自动离开错题本。</div></div><div class="actions" style="margin:20px 0"><button class="btn primary" id="drillwrong">🎯 专项刷这 ${list.length} 题</button></div>${list.map(q=>`<div class="mistake-entry"><span class="taglabel">${escapeHtml(lessonBy(q.lesson).title)}</span><div style="font-weight:800;margin:8px 0">${escapeHtml(q.prompt)}</div><div class="answer">✓ ${escapeHtml(q.answer)}</div><p>${escapeHtml(q.why)}</p></div>`).join('')}`:`<div class="empty"><span class="e">🌸</span><strong>目前没有待复习的错题</strong><p>继续做测验吧。做错了才会在这里出现；重新答对后自动清除。</p><button class="btn primary" id="freshquiz">去做几道题 →</button></div>`}`;if(list.length)$('drillwrong').onclick=()=>startQuiz('wrong');else $('freshquiz').onclick=()=>{quiz=null;navigate('quiz')};}
function exportFile(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportCsv(){let esc=s=>'"'+String(s).replace(/"/g,'""')+'"';let csv='\ufeff'+[['word','pos','zh','category','example'],...vocab.map(x=>[x.word,x.pos,x.zh,x.category,x.example])].map(r=>r.map(esc).join(',')).join('\r\n');exportFile('巴西葡语_已学词汇_含阴阳性.csv',csv,'text/csv;charset=utf-8')}
function backup(){exportFile('葡语学习进度备份.json',JSON.stringify({app:'pt-br-study',version:3,exported:day(),progress:store},null,2),'application/json;charset=utf-8')}
function restore(file){if(!file)return;let reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.app!=='pt-br-study'||!obj.progress||!Array.isArray(obj.progress.done)||!Array.isArray(obj.progress.wrong)){throw new Error('文件格式不正确')}store={...initial,...obj.progress};save();alert('✅ 进度恢复成功！');render()}catch(e){alert('无法读取这份备份，请选择本站导出的 JSON 文件。')}};reader.readAsText(file)}
function renderCheat(){let ref=[['人称 → 动词','eu → -o；você / ele / ela → 第三单；nós → 我们式；vocês / eles / elas → 第三复','“Ana e eu”用 nós；“Ana e Rui”用 eles。'],['SER','sou / é / somos / são','身份、国籍、职业、定义。'],['ESTAR','estou / está / estamos / estão','状态和位置。'],['TER','tenho / tem / temos / têm','谁拥有某个东西；复数 têm 有 ^。'],['-AR 规则动词','estudo / estuda / estudamos / estudam','去掉 -ar，再换 o / a / amos / am。'],['-ER 规则动词','como / come / comemos / comem','去掉 -er，再换 o / e / emos / em。'],['-IR 规则动词','abro / abre / abrimos / abrem','去掉 -ir，再换 o / e / imos / em。'],['定冠词','o / a / os / as','看后面的名词（性、数），不是看主语。'],['不定冠词','um / uma / uns / umas','一个/一些；和名词配合。'],['EM + 定冠词','no / na / nos / nas','em + o/a/os/as；例：na biblioteca。'],['DE + 定冠词','do / da / dos / das','de + o/a/os/as；例：do professor。'],['A + 定冠词','ao / à / aos / às','a + o/a/os/as；例：vou à universidade。'],['所有格','meu livro / minha aula / meus livros / minhas aulas','meu 等看东西的性数；dele/dela 看拥有者。'],['数字 21–99','vinte e um；trinta e quatro；noventa e nove','非整十：十位 + e + 个位。'],['国名 vs 国籍','o Brasil → brasileiro / brasileira','国家名大写，国籍/语言一般小写。'],['礼貌对话','Bom dia! · Boa tarde! · Boa noite!','Obrigado/obrigada 随说话人；o senhor/a senhora 是正式称呼。'],['问句','quem · onde · quando · como · quanto · por que','Onde 问地点；Quando 问时间。'],['表达存在','Há três livros. / Tem três livros.（口语）','正式书面常用 há；个人拥有用 ter。'],['喜欢和需要','gostar de · precisar de','千万记住 de。'],['读写技巧','cognate ≠ 一定同义；livraria ≠ library','biblioteca 才是 library。']];
let cats=['全部',...new Set(vocab.map(x=>x.category))];let display=vocab.filter(v=>(listCategory==='全部'||v.category===listCategory)&&(!listSearch||[v.word,v.zh].join(' ').toLowerCase().includes(listSearch.toLowerCase())));app.innerHTML=`<div class="section-head" style="margin-top:0"><div><h2>一页搞懂语法 📌</h2><p>考前 5 分钟快速看。尤其记住三个坑：看后面的名词、看主语、看句意。</p></div><button class="btn soft" id="exportcsv">⬇ 下载 ${vocab.length} 词 CSV</button></div><div class="two-col">${ref.map(r=>`<div class="cheat-item"><h3>${escapeHtml(r[0])}</h3><div class="formula">${escapeHtml(r[1])}</div><p>${escapeHtml(r[2])}</p></div>`).join('')}</div><div class="section-head"><div><h2>单词大全 📚</h2><p>包括数字 0–99；名词尽量与冠词一起显示。可复制或导出 CSV。</p></div><span class="pill">${display.length} / ${vocab.length} 词</span></div><div class="toolbar"><select class="field" id="listcat"><option value="全部">所有分类</option>${cats.slice(1).map(x=>`<option ${x===listCategory?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select><input class="field search" id="listsearch" value="${escapeHtml(listSearch)}" placeholder="🔎 搜葡语 / 中文"><button class="btn secondary" id="exportcsv2">⬇ CSV</button></div><div class="vocab-list" id="vocablist">${display.length?display.map(v=>`<div class="vocab-row"><div><div class="word">${escapeHtml(v.word)}</div><div class="small muted">${escapeHtml(v.pos)} · ${escapeHtml(v.category)}</div></div><div class="translation">${escapeHtml(v.zh)}</div><button class="iconbtn" data-speech="${escapeHtml(v.word.split('/')[0].trim())}" aria-label="朗读">🔊</button></div>`).join(''):'<div class="empty">没有找到匹配的单词。</div>'}</div><div class="section-head"><div><h2>进度备份与恢复 💾</h2><p>本网站把进度保存在这台设备的这个浏览器里。清理浏览器数据或换设备前，请先备份。</p></div></div><div class="panel"><div class="settings-row"><div><strong>导出学习进度</strong><div class="muted small">包含完成的课程、单词卡复习情况、错题与答题次数</div></div><button class="btn secondary" id="backup">下载 JSON 备份</button></div><div class="settings-row"><div><strong>导入以前的进度</strong><div class="muted small">恢复后会覆盖当前浏览器记录</div></div><label class="btn secondary" style="cursor:pointer">选择备份文件<input type="file" id="restore" accept=".json,application/json" style="display:none"></label></div></div>`;
$('exportcsv').onclick=exportCsv;$('exportcsv2').onclick=exportCsv;$('backup').onclick=backup;$('restore').onchange=e=>restore(e.target.files[0]);$('listcat').onchange=e=>{listCategory=e.target.value;renderCheat()};$('listsearch').oninput=e=>{listSearch=e.target.value;renderCheat();let n=$('listsearch');n.focus();n.setSelectionRange(n.value.length,n.value.length)};document.querySelectorAll('[data-speech]').forEach(b=>b.onclick=()=>speak(b.dataset.speech));}
document.addEventListener('keydown',e=>{if(page==='cards'&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){if(e.key===' '&&document.activeElement.id!=='flashcard'){e.preventDefault();cardFlip=!cardFlip;drawCard()}else if(e.key==='ArrowRight'){e.preventDefault();if(cardPool.length){cardIndex=(cardIndex+1)%cardPool.length;cardFlip=false;drawCard()}}}});
render();
})();
</script>
</body>
